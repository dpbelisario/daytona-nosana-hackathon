<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hackathon Starter</title>
  <style>
    :root { color-scheme: light dark; --bg:#0b0d12; --fg:#e8ebf2; --muted:#9aa3b5; --accent:#7c9cff; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width:720px; margin:0 auto; padding:48px 16px; }
    h1 { margin:0 0 8px; }
    p { color:var(--muted); }
    form { display:flex; gap:8px; margin-top:24px; }
    input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #333a4a; background:#121621; color:var(--fg); }
    button { padding:10px 16px; border-radius:8px; border:0; background:var(--accent); color:#0b0d12; font-weight:600; cursor:pointer; }
    pre { white-space:pre-wrap; background:#121621; padding:16px; border-radius:8px; min-height:3em; }
  </style>
</head>
<body>
<main>
  <h1>It works 🚀</h1>
  <p>Served from a Daytona sandbox. Set an LLM endpoint below (your Nosana deployment URL, OpenAI-compatible) to try a prompt.</p>
  <form id="f">
    <input id="ep" placeholder="https://<your-nosana-endpoint>" />
  </form>
  <form id="q">
    <input id="prompt" placeholder="Ask something…" />
    <button>Send</button>
  </form>
  <pre id="out"></pre>
</main>
<script>
  const ep = document.getElementById('ep');
  try { ep.value = localStorage.getItem('ep') || ''; } catch {}
  ep.addEventListener('change', () => { try { localStorage.setItem('ep', ep.value); } catch {} });
  document.getElementById('q').addEventListener('submit', async (e) => {
    e.preventDefault();
    const out = document.getElementById('out');
    out.textContent = '…';
    try {
      const base = ep.value.trim().replace(/\/$/, '');
      // Use whatever model the deployment is serving (works for Ollama, vLLM, SGLang).
      const models = await (await fetch(base + '/v1/models')).json();
      const model = models.data?.[0]?.id;
      if (!model) throw new Error('No model found at ' + base + '/v1/models (still loading?)');
      const r = await fetch(base + '/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model,
          messages: [{ role: 'user', content: document.getElementById('prompt').value }],
        }),
      });
      const j = await r.json();
      out.textContent = j.choices?.[0]?.message?.content ?? JSON.stringify(j, null, 2);
    } catch (err) { out.textContent = 'Error: ' + err; }
  });
</script>
</body>
</html>
